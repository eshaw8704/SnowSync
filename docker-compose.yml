services:
  postgres:
    image: postgres:16-alpine
    container_name: snowsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snowsync
      POSTGRES_PASSWORD: snowsync
      POSTGRES_DB: snowsync
    ports:
      - '5432:5432'
    volumes:
      - snowsync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snowsync -d snowsync']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snowsync-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - snowsync-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  snowsync-postgres-data:
  snowsync-redis-data:
