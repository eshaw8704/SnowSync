#SnowSync CI: every pull request and every push to main must pass all four checks
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Server tests run against a real PostgreSQL, started by GitHub next to the job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: snowsync
          POSTGRES_PASSWORD: snowsync
          POSTGRES_DB: snowsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowsync -d snowsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://snowsync:snowsync@localhost:5432/snowsync_test?schema=public
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (also generates the Prisma client)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
